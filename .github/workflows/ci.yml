name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PIP_CONSTRAINT: constraints/requirements-ci.txt

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/requirements-ci.txt

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run tests
        run: python scripts/run_tests.py

      - name: Verify test scratch cleanup
        run: python -c "from pathlib import Path; assert not Path('.pytest_tmp_run').exists()"

      - name: Check repository integrity
        run: python -m paper_exp.cli check --strict

      - name: Build distribution artifacts
        run: python -m build

      - name: Install and inspect the wheel
        run: >-
          python -c "from pathlib import Path; import subprocess, sys;
          wheels=list(Path('dist').glob('*.whl')); assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--force-reinstall', '--no-deps', str(wheels[0])])"

      - name: Verify installed console module
        run: paper-exp --help

      - name: Verify generated files did not change the source tree
        run: >-
          python -c "import subprocess;
          status=subprocess.check_output(['git', 'status', '--porcelain',
          '--untracked-files=all'], text=True); assert not status, status"
